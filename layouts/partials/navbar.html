<!-- Navbar Elegante -->
<div class="container-fluid bg-white sticky-top shadow-sm" style="border-bottom: 3px solid #947B18;">
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-white navbar-light p-0 py-3">
            <!-- Espaço para o Logotipo Oficial -->
            <a href="{{ "/" | relURL }}" class="navbar-brand d-flex align-items-center">
                <h2 class="mb-0" style="color: #141313; font-family: 'Krona One', sans-serif;">
                    LV&P <span style="font-size: 1rem; color: #947B18; font-family: 'Montserrat', sans-serif;">Advogados</span>
                </h2>
            </a>
            
            <button type="button" class="navbar-toggler me-0" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto p-4 p-lg-0">
                    {{ range .Site.Menus.main }}
                        <a href="{{ .URL | relURL }}" class="nav-item nav-link" style="color: #141313; font-weight: 600; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px;">
                            {{ .Name }}
                        </a>
                    {{ end }}
                    
                </div>
            </div>
        </nav>
    </div>
</div>
