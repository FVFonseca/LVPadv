<head>
    <meta charset="utf-8">
    <title>{{ if and .Title (ne .IsHome true) }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta name="color-scheme" content="light">
    <meta name="description" content="Lima, Vieira & Picinin Advogados — Assessoria jurídica consultiva e contenciosa para pessoas físicas e empresas.">

    <!-- Open Graph / WhatsApp / LinkedIn (use sempre a versão com fundo sólido) -->
    <meta property="og:title" content="{{ if and .Title (ne .IsHome true) }}{{ .Title }} | {{ end }}Lima, Vieira & Picinin Advogados" />
    <meta property="og:description" content="Assessoria jurídica consultiva e contenciosa voltada à proteção de direitos, redução de riscos e soluções juridicamente seguras." />
    <meta property="og:image" content="https://limavieiraepicinin.adv.br/img/favicon-dark.jpg" />
    <meta property="og:image:secure_url" content="https://limavieiraepicinin.adv.br/img/favicon-dark.jpg" />
    <meta property="og:image:type" content="image/jpg" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:url" content="https://limavieiraepicinin.adv.br{{ .RelPermalink }}" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Favicon adaptável ao modo claro e escuro do navegador -->
    <link rel="icon" type="image/png" href="{{ "img/favicon.png" | relURL }}" media="(prefers-color-scheme: light)">
    <link rel="icon" type="image/png" href="{{ "img/favicon-dark.png" | relURL }}" media="(prefers-color-scheme: dark)">
    <link rel="apple-touch-icon" href="{{ "img/favicon-dark.png" | relURL }}">

    <!-- Google Fonts & Icons (External links stay the same) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Bibliotecas de Ícones (FontAwesome e Bootstrap Icons) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Local CSS (MUST use relURL) -->
    <link href="{{ "lib/animate/animate.min.css" | relURL }}" rel="stylesheet">
    <link href="{{ "lib/owlcarousel/assets/owl.carousel.min.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/bootstrap.min.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/style.css" | relURL }}" rel="stylesheet">
</head>
