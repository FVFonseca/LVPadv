<head>
    <meta charset="utf-8">
    <title>{{ if and .Title (ne .IsHome true) }}{{ .Title }} | {{ end }}{{ .Site.Title }}</title>   
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">
    <meta property="og:title" content="Lima, Vieira & Picinin" />
    <meta property="og:description" content="Escritório de Advocacia" />
    <meta property="og:image" content="https://limavieiraepicinin.adv.br/img/hero-bg.jpg" />
    <meta property="og:url" content="https://limavieiraepicinin.adv.br/" />
    <meta property="og:type" content="website" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="{{ "img/favicon.png" | relURL }}">
    <link rel="apple-touch-icon" href="{{ "img/favicon.png" | relURL }}">

    <!-- Google Fonts & Icons (External links stay the same) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Krona+One&family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">

    <!-- Bibliotecas de Ícones (FontAwesome e Bootstrap Icons) -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Local CSS (MUST use relURL) -->
    <link href="{{ "lib/animate/animate.min.css" | relURL }}" rel="stylesheet">
    <link href="{{ "lib/owlcarousel/assets/owl.carousel.min.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/bootstrap.min.css" | relURL }}" rel="stylesheet">
    <link href="{{ "css/style.css" | relURL }}" rel="stylesheet">
